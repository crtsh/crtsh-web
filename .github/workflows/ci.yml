name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templates
        run: go run github.com/valyala/quicktemplate/qtc@latest -dir=request/templates

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -covermode=atomic -coverprofile=coverage.out $(go list ./... | grep -v /request/templates)

      - name: Report coverage
        run: go tool cover -func=coverage.out

  test-race:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templates
        run: go run github.com/valyala/quicktemplate/qtc@latest -dir=request/templates

      - name: Run tests with race detector
        run: go test -race -v ./...

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templates
        run: go run github.com/valyala/quicktemplate/qtc@latest -dir=request/templates

      - name: Run integration tests
        env:
          CRTSHWEB_TEST_DSN: postgres://test:test@localhost:5432/testdb?sslmode=disable
        run: go test -tags=integration -race -v -count=1 -timeout=60s ./request/

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templates
        run: go run github.com/valyala/quicktemplate/qtc@latest -dir=request/templates

      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t crtsh-web:ci .

      - name: Smoke test container
        run: |
          # Start the container in the background.
          docker run -d --name crtsh-web-smoke -p 8081:8081 crtsh-web:ci

          # Wait for the container to start accepting connections.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/livez > /dev/null 2>&1; then
              echo "Container is alive"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Container failed to respond to /livez within 30s"
              docker logs crtsh-web-smoke
              exit 1
            fi
            sleep 1
          done

          # Verify the liveness response.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/livez)
          echo "livez returned HTTP $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Expected 200, got $STATUS"
            docker logs crtsh-web-smoke
            exit 1
          fi

          docker stop crtsh-web-smoke
